<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev profile</title>
    <link rel="stylesheet" href="/css/dev.css">
</head>
<body>
    <div class="column">
        <!-- PFP & Title -->
        <img src="/content/pfp_480.png" alt="Profile Picture" class="pfp">
        <div class="title">
            J Stuff Dev Profile
        </div>
        <hr class="solid-break">
        
        <br class="med-br">

        <div class="header">
            Welcome to my developer profile. <br>
            Here I've showcased my Github stats and some of the projects I've worked on. <br>
            Interested in getting in touch? Use the buttons back on the <a href="../">Home Page!</a><br>
        </div>
        
        <br class="med-br">

        <div class="subtitle">
            VS Code Stats
        </div>
        <hr class="solid-break">
        <a href="https://github.com/j-stuff/" target="_blank">
        <img src="https://github-readme-stats.vercel.app/api/wakatime?username=JStuff&show_icons=true&theme=transparent&layout=compact" class="stat-img"> </a> <br>
        


        <br class="med-br">

        <div class="subtitle">
            GitHub Stats
        </div>
        <hr class="solid-break">
        <a href="https://github.com/j-stuff/" target="_blank">
        <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=J-Stuff&show_icons=true&theme=transparent" class="stat-img-sm"> </a> <br>
        
        <a href="https://github.com/j-stuff/" target="_blank">
        <img src="https://github-readme-stats.vercel.app/api?username=J-Stuff&show_icons=true&theme=transparent&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage" class="stat-img"> </a> <br>
        

        <br class="med-br">

        <div class="subtitle">
            Repo Showcase
        </div>
        <hr class="solid-break">
        <div class="gh-cards">
            
            <a href="https://github.com/J-Stuff/KaspBot-V2" target="_blank"><img src="https://github-readme-stats.vercel.app/api/pin/?username=J-Stuff&repo=KaspBot-V2&show_owner=true&show_icons=true&theme=transparent" alt=""></a>
            <a href="https://github.com/J-Stuff/KISB" target="_blank"><img src="https://github-readme-stats.vercel.app/api/pin/?username=J-Stuff&repo=KISB&show_owner=true&show_icons=true&theme=transparent" alt=""></a>
        </div>
        <br class="med-br">


    </div>
</body>
</html>
